// SPDX-License-Identifier: Apache-2.0
//
// Simulator-agnostic extensions to the alpasim egodriver contract.
//
// The names say what a message carries, never which simulator produced it: the
// same payload describes a CARLA world today and can describe another runtime's
// tomorrow, and a driver reading it should not have to care which.
//
// Nothing here changes the alpasim wire format.  The upstream service
// `egodriver.EgodriverService` is used verbatim (see `alpasim_grpc`); the
// messages below are only ever carried inside the two `bytes` extension points
// upstream already provides:
//
//   * `egodriver.DriveRequest.renderer_data`
//         -> serialized `driver_extension.v0.RendererData`
//   * `egodriver.DriveResponse.DebugInfo.unstructured_debug_info`
//         -> serialized `driver_extension.v0.DriveDebugInfo`
//
// A driver that ignores those bytes stays fully compatible; a driver that wants
// simulator ground truth can parse them.  Upstream messages are imported and
// composed (never redefined) so field numbers can never drift.

syntax = "proto3";

package driver_extension.v0;

import "alpasim_grpc/v0/common.proto";
import "alpasim_grpc/v0/egodriver.proto";
import "alpasim_grpc/v0/sensorsim.proto";

////////////////////////////////////////////////////////////////////////////////
// Renderer -> driver payload (carried in DriveRequest.renderer_data)
////////////////////////////////////////////////////////////////////////////////

// State of the traffic light that currently governs the ego lane.
enum TrafficLightState {
  TRAFFIC_LIGHT_STATE_UNKNOWN = 0;
  TRAFFIC_LIGHT_STATE_NONE = 1; // no light applies to the ego right now
  TRAFFIC_LIGHT_STATE_RED = 2;
  TRAFFIC_LIGHT_STATE_YELLOW = 3;
  TRAFFIC_LIGHT_STATE_GREEN = 4;
  TRAFFIC_LIGHT_STATE_OFF = 5;
}

message Weather {
  float cloudiness = 1;
  float precipitation = 2;
  float precipitation_deposits = 3;
  float wind_intensity = 4;
  float sun_azimuth_angle = 5;
  float sun_altitude_angle = 6;
  float fog_density = 7;
  float wetness = 8;
}

// An actor other than the ego, in the alpasim `local` frame (right handed,
// already converted out of the simulator's own convention).
message ActorState {
  string track_id = 1;
  string type_id = 2; // Simulator type id, e.g. CARLA's "vehicle.tesla.model3"
  common.Pose pose_local_to_aabb = 3;
  common.AABB aabb = 4;
  common.DynamicState dynamic_state = 5;
}

// Packed into `egodriver.DriveRequest.renderer_data`.
message RendererData {
  fixed64 snapshot_timestamp_us = 1;
  // Simulator frame counter; useful for correlating with recordings.
  uint64 frame_id = 2;
  string map_name = 3;
  Weather weather = 4;
  TrafficLightState ego_traffic_light = 5;
  // Distance to the governing traffic light's stop line, in metres, measured
  // along the ego's heading.
  //
  // Negative when no stop line applies to the ego: either `ego_traffic_light`
  // is NONE/UNKNOWN, or the ego has already crossed the line. The two cases
  // are deliberately not distinguished -- in both there is nothing ahead to
  // stop for. A straight-line distance would be ambiguous, since it starts
  // growing again once the ego crosses, and a policy that stopped inside the
  // light's trigger volume would never be told it had got through.
  float ego_traffic_light_distance_m = 6;
  // Posted speed limit for the ego lane, in m/s. 0 when unknown.
  float speed_limit_mps = 7;
  repeated ActorState actors = 8;
  // The drivable lanes around the ego, in the rig frame at
  // `snapshot_timestamp_us`. Empty unless the runtime is configured to send
  // them (`RuntimeConfig.send_lanes`): a map-conditioned policy needs them, and
  // nothing else should pay for them.
  repeated Lane lanes = 9;
  // One sweep per configured LiDAR, in the rig frame. Empty unless
  // `RuntimeConfig.lidars` configures one. Carried here because the egodriver
  // contract has no LiDAR submission RPC.
  repeated LidarSweep lidar = 10;
}

// Lane marking on one side of a lane. The values follow OpenDRIVE's road-mark
// types, which CARLA's `carla.LaneMarkingType` also mirrors.
enum LaneMarkingType {
  LANE_MARKING_TYPE_UNKNOWN = 0;
  LANE_MARKING_TYPE_NONE = 1;
  LANE_MARKING_TYPE_SOLID = 2;
  LANE_MARKING_TYPE_BROKEN = 3;
  LANE_MARKING_TYPE_SOLID_SOLID = 4;
  LANE_MARKING_TYPE_SOLID_BROKEN = 5;
  LANE_MARKING_TYPE_BROKEN_SOLID = 6;
  LANE_MARKING_TYPE_BROKEN_BROKEN = 7;
  LANE_MARKING_TYPE_BOTTS_DOTS = 8;
  LANE_MARKING_TYPE_GRASS = 9;
  LANE_MARKING_TYPE_CURB = 10;
  LANE_MARKING_TYPE_OTHER = 11;
}

// One drivable lane, cropped to the runtime's lane horizon.
//
// The three polylines are sampled at the same stations, in the lane's driving
// direction, so point i of each describes one cross-section. "Left" and
// "right" are relative to that direction, which in the right-handed rig frame
// puts the left boundary on the +y side of a lane heading along +x.
//
// Each polyline is little-endian float32, row-major [num_points, 3] (x, y, z in
// the rig frame), packed like `LidarSweep.points_xyzi`: a message per point
// cost ~25 ms a step to build for a town's worth of lanes, and as long again
// to read back.
message Lane {
  // Stable across steps within a session, e.g.
  // "<road_id>:<section_id>:<lane_id>" for an OpenDRIVE map.
  string lane_id = 1;
  uint32 num_points = 2;
  bytes centerline_xyz = 3;
  bytes left_boundary_xyz = 4;
  bytes right_boundary_xyz = 5;
  LaneMarkingType left_marking = 6;
  LaneMarkingType right_marking = 7;
  // The light whose stop line lies on this lane; NONE when there is none.
  TrafficLightState traffic_light = 8;
  // Posted speed limit in m/s. 0 when unknown -- not "no limit".
  float speed_limit_mps = 9;
  // Position of this lane along the ego's route, 0 for the first lane of the
  // route; -1 when the lane is not on the route. Lanes behind the ego keep
  // their index, so a consumer wanting "the route from here" orders by it and
  // drops what lies behind.
  int32 route_index = 10;
  bool is_junction = 11;
}

// One LiDAR sweep. Points are expressed in the rig frame (not the sensor's),
// so a consumer never needs the mount to use them; `rig_to_lidar` is carried
// for consumers that want the sensor origin, e.g. for ray casting.
message LidarSweep {
  string logical_id = 1;
  fixed64 timestamp_us = 2;
  common.Pose rig_to_lidar = 3;
  uint32 num_points = 4;
  // Little-endian float32, row-major [num_points, 4]: x, y, z in metres and
  // intensity normalised to [0, 1]. Packed rather than `repeated Vec3` because a
  // sweep is ~10^5 points and a message per point costs an order of magnitude
  // in size and parse time.
  bytes points_xyzi = 5;
}

////////////////////////////////////////////////////////////////////////////////
// Driver -> runtime payload (carried in DriveResponse.DebugInfo)
////////////////////////////////////////////////////////////////////////////////

// Packed into `egodriver.DriveResponse.DebugInfo.unstructured_debug_info`.
message DriveDebugInfo {
  string policy_name = 1;
  float inference_seconds = 2;
  // Free-form scalars the policy wants surfaced in the rollout metrics.
  map<string, double> scalars = 3;
}

////////////////////////////////////////////////////////////////////////////////
// Session description
////////////////////////////////////////////////////////////////////////////////

// The runtime's view of a rollout session.  Wraps (rather than replaces) the
// upstream request that is actually sent over the wire, so the two can never
// disagree about session_uuid, seed or camera set.
message DriveSessionInfo {
  egodriver.DriveSessionRequest base = 1;
  string map_name = 2;
  string scenario_name = 3;
  // Simulator tick period; `policy_timestep_us` is a multiple of it.
  fixed64 fixed_delta_us = 4;
  fixed64 policy_timestep_us = 5;
  // Longitudinal offset from the simulator's vehicle origin to the alpasim rig origin
  // (rear axle centre projected to the ground), in metres.
  float rear_axle_offset_m = 6;
  repeated nre.grpc.protos.sensorsim.AvailableCamerasReturn.AvailableCamera cameras = 7;
}

////////////////////////////////////////////////////////////////////////////////
// Compatibility report
////////////////////////////////////////////////////////////////////////////////

// How closely this project follows one aspect of the alpasim contract.
enum CompatLevel {
  COMPAT_LEVEL_UNSPECIFIED = 0;
  // Byte-for-byte the upstream behaviour.
  COMPAT_LEVEL_EXACT = 1;
  // Same messages, narrower behaviour (e.g. pinhole cameras only).
  COMPAT_LEVEL_PARTIAL = 2;
  // Same driver-facing contract, different implementation behind it
  // (e.g. CARLA physics instead of the PhysicsService RPC).
  COMPAT_LEVEL_STRUCTURAL = 3;
  // Present upstream, absent here.
  COMPAT_LEVEL_UNIMPLEMENTED = 4;
  // Beyond upstream; carried in an upstream-sanctioned extension point.
  COMPAT_LEVEL_EXTENSION = 5;
}

message CompatEntry {
  string area = 1;
  string alpasim_behaviour = 2;
  // What this implementation does instead.
  string implementation_behaviour = 3;
  CompatLevel level = 4;
  // Proto symbols this entry is about, e.g. "egodriver.DriveRequest".
  repeated string symbols = 5;
}

message CompatReport {
  // Version of this package.
  string implementation_version = 1;
  // alpasim commit the `alpasim-grpc` dependency is pinned to.
  string alpasim_grpc_rev = 2;
  // `alpasim_grpc.API_VERSION_MESSAGE`, forwarded unchanged.
  common.VersionId.APIVersion alpasim_grpc_api_version = 3;
  repeated CompatEntry entries = 4;
}
